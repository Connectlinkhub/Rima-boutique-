<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reema Official - Chat</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9641972902370359" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e5ddd5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #header {
    background: #075e54;
    color: white;
    padding: 14px 16px;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #header .avatar {
    width: 36px; height: 36px;
    background: #ffffff33;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  #join {
    padding: 20px;
    max-width: 420px;
    margin: 40px auto;
    background: white;
    border-radius: 12px;
    text-align: center;
  }
  #join input {
    width: 100%; padding: 12px; margin: 10px 0; font-size: 16px;
    border: 1px solid #ccc; border-radius: 8px;
  }
  #join button {
    padding: 12px 24px; font-size: 16px; border: none; border-radius: 24px;
    background: #075e54; color: white; cursor: pointer;
  }
  #chatArea {
    flex: 1;
    display: none;
    flex-direction: column;
    height: 100vh;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.3;
    word-wrap: break-word;
  }
  .me {
    align-self: flex-end;
    background: #dcf8c6;
  }
  .them {
    align-self: flex-start;
    background: white;
  }
  .bubble .sender {
    font-size: 11px;
    color: #888;
    margin-bottom: 2px;
  }
  #inputRow {
    display: flex;
    padding: 10px;
    background: #f0f0f0;
    gap: 8px;
  }
  #inputRow input {
    flex: 1;
    padding: 12px;
    border-radius: 24px;
    border: 1px solid #ccc;
    font-size: 15px;
  }
  #inputRow button {
    background: #075e54;
    color: white;
    border: none;
    border-radius: 50%;
    width: 46px; height: 46px;
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="join">
  <h2>Reema Official</h2>
  <p>Enter your name to start chatting</p>
  <input id="name" placeholder="Your name" maxlength="20">
  <button onclick="startChat()">Start Chat</button>
</div>

<div id="chatArea">
  <div id="header">
    <div class="avatar">R</div>
    <div>Reema Official</div>
  </div>
  <div id="messages"></div>
  <div id="inputRow">
    <input id="msgInput" placeholder="Type a message" maxlength="500">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDoEN6MRNgZ8xKt9zxSfcHRwF77CItz7hs",
  authDomain: "turth-chat-bottle.firebaseapp.com",
  databaseURL: "https://turth-chat-bottle-default-rtdb.firebaseio.com",
  projectId: "turth-chat-bottle",
  storageBucket: "turth-chat-bottle.firebasestorage.app",
  messagingSenderId: "953030342199",
  appId: "1:953030342199:web:d7e073979f343e55f731b2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let myName = "";
const myId = "c" + Math.random().toString(36).slice(2, 9);

window.startChat = function () {
  myName = document.getElementById("name").value.trim();
  if (!myName) { alert("Please enter your name"); return; }

  document.getElementById("join").style.display = "none";
  document.getElementById("chatArea").style.display = "flex";

  const chatRef = query(ref(db, "boutique/" + myId + "/messages"), limitToLast(100));
  onValue(chatRef, function (snap) {
    const box = document.getElementById("messages");
    box.innerHTML = "";
    snap.forEach(function (child) {
      const m = child.val();
      const div = document.createElement("div");
      div.className = "bubble " + (m.from === "customer" ? "me" : "them");
      const senderLabel = document.createElement("div");
      senderLabel.className = "sender";
      senderLabel.textContent = m.from === "customer" ? myName : "Reema Official";
      const text = document.createElement("div");
      text.textContent = m.text;
      div.appendChild(senderLabel);
      div.appendChild(text);
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  });

  // Save customer name so the boutique owner knows who this chat belongs to
  push(ref(db, "boutique/" + myId + "/info"), { name: myName, startedAt: Date.now() });
};

window.sendMessage = function () {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;
  push(ref(db, "boutique/" + myId + "/messages"), {
    from: "customer",
    text: text,
    ts: Date.now()
  });
  input.value = "";
};

document.getElementById("msgInput")?.addEventListener("keypress", function (e) {
  if (e.key === "Enter") window.sendMessage();
});
</script>

</body>
</html>'''
